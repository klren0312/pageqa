---
name: page-test-agent CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # 注意：端到端（e2e）测试需要 bsk daemon + 已连接浏览器 + 可用的 LLM 端点，
      # 这些在 CI 环境中不具备，故不在此运行。如需本地 e2e，请在已连接浏览器的
      # 机器上执行：node dist/index.js --json examples/smoke.md
